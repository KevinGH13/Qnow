# Nightly logical backup of the production database (Neon main branch).
# Neon's free plan only keeps 6 hours of restore history, so this keeps 30 days of dumps
# as private workflow artifacts.
#
# Setup: GitHub → Settings → Secrets and variables → Actions → New repository secret
#   BACKUP_DATABASE_URL = the DIRECT (non-pooled) connection string of the main branch
#
# Restore: download the artifact, then
#   pg_restore --clean --if-exists --no-owner -d "<connection string>" qnow-<date>.dump
name: Database backup

on:
  # schedule disabled: nightly cron turned off. Re-enable with:
  #   schedule:
  #     - cron: '17 7 * * *' # every day, 07:17 UTC (02:17 in Medellín)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Set the BACKUP_DATABASE_URL repository secret."
            exit 1
          fi
          file="qnow-$(date -u +%Y-%m-%d).dump"
          # pg_dump 18 can dump older servers (Neon runs 15–18).
          docker run --rm -e DATABASE_URL -v "$PWD:/out" postgres:18-alpine \
            sh -c "pg_dump --format=custom --no-owner --no-privileges \"\$DATABASE_URL\" -f /out/$file"
          ls -lh "$file"
          echo "FILE=$file" >> "$GITHUB_ENV"

      - name: Keep for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 30
          if-no-files-found: error
